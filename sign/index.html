<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Montserrat,-apple-system,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header b{font-size:17px;flex:1}

main{padding:12px 12px calc(env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
@media (min-width:900px){main{max-width:920px;padding-top:20px}.msg{margin-right:0}.modal{align-items:center;justify-content:center}.modal .in{max-width:520px;border-radius:18px}}
#inst{display:none;background:#fff;color:var(--acc);border-radius:8px;font-weight:700;font-size:13px;padding:6px 10px}

#hidden{position:fixed;left:-10000px;top:0}
.center{text-align:center;padding:40px 10px}
.a4{width:794px;min-height:1123px;background:#fff;color:#000;padding:56px 60px;font:13px/1.4 Montserrat,Arial,sans-serif;box-sizing:border-box}

</style>

<script>
var VAPID_PUB = 'BE2oHIVgxqCbzGb1XQMZjBWByXWigMvKHyElsqIwOJTCrVjynSghusXSB6mTUpNQ71AOdq2H17MshOHFDb1yNuU';

var AVR_SITE = '../';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  }).catch(function () { return false; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  if (!ls('sg_token') || !ME) return showLogin();
  showLock();
}

/* ---------- вход по личному коду ---------- */
function showLogin(msg) {
  UNLOCKED = false; $('out').style.display = 'none'; $('staffBtn').style.display = 'none'; $('bd').innerHTML = ''; $('hd').textContent = 'АВР — Подписи';
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('app').innerHTML = '<div class="card"><h3 style="margin:0 0 10px">Вход в кабинет</h3>' +

    '<p class="muted">Первый вход — по коду, который выдал администратор. Сразу после входа придумаете свой пароль. Никому его не сообщайте.</p></div>' +
    (standalone ? '' : '<div class="card muted"><b>Установите приложение:</b><br>iPhone — Safari → «Поделиться» → «На экран „Домой“».<br>Android — Chrome → ⋮ → «Установить приложение».<br>Компьютер — Chrome или Edge → кнопка «⬇ Установить» вверху или значок установки в адресной строке; появится значок на рабочем столе.</div>');

      ls('sg_token', j.token); saveTok(j.token); ME = j.me; ls('sg_me', JSON.stringify(ME)); UNLOCKED = true;
      afterLogin();

  };
}

/* ---------- Face ID / отпечаток (WebAuthn, проверка на телефоне) ---------- */

}

function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  bioAvailable().then(function (ok) {
    if (!MOBILE || !ok || ls('sg_bio')) return showInbox();
    $('app').innerHTML = '<div class="card center"><div style="font-size:44px">🔐</div><h3>Входить через ' + BIO + '?</h3><p class="muted">Код больше вводить не придётся.</p>' +

    $('bNo').onclick = showInbox;
    $('bOn').onclick = function () {
      navigator.credentials.create({ publicKey: {
        challenge: rndBytes(32), rp: { name: 'АВР Подписи' },
        user: { id: rndBytes(16), name: ME.name, displayName: ME.name },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        timeout: 60000, attestation: 'none' } })
        .then(function (c) { ls('sg_bio', b64u(c.rawId)); showInbox(); })
        .catch(function (e) { $('bErr').textContent = 'Не получилось: ' + e.message; });

  return navigator.credentials.get({ publicKey: { challenge: rndBytes(32), allowCredentials: [{ type: 'public-key', id: unb64(ls('sg_bio')), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });

    '<button class="btn ' + (bio ? 'gray' : '') + '" id="kGo" type="button">Войти по паролю</button><div class="err" id="kErr"></div>' +
    '<p><a href="#" id="kOther" class="muted">Войти другим человеком</a></p></div>';
  if (bio) $('kBio').onclick = function () { bioCheck().then(function () { UNLOCKED = true; showInbox(); }).catch(function (e) { $('kErr').textContent = 'Не распознано. Попробуйте ещё раз или войдите по коду.'; }); };
  $('kGo').onclick = function () {
    var b = this; b.disabled = true;
    api({ sign_api: 'login', name: ME.name, code: $('kCode').value, device: devName() }).then(function (j) {
      ls('sg_token', j.token); saveTok(j.token); ME = j.me; ls('sg_me', JSON.stringify(ME)); UNLOCKED = true; afterLogin();
    }).catch(function (e) { $('kErr').textContent = e.message; b.disabled = false; });
  };
  $('kOther').onclick = function (e) { e.preventDefault(); logout(); };
}
function logout() { try { caches.delete('avr-sign-auth'); } catch (e) {} ls('sg_token', null); ls('sg_bio', null); ls('sg_me', null); ME = null; showLogin(); }
$('out').onclick = function () { if (confirmBox('Выйти из кабинета на этом телефоне?')) logout(); };
function confirmBox(t) { return window.confirm(t); }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { HIDDEN_AT = Date.now(); return; }
  if (UNLOCKED && HIDDEN_AT && Date.now() - HIDDEN_AT > 5 * 60 * 1000) showLock();
  else if (UNLOCKED) load(true);

/* ---------- лента сообщений ---------- */
var POLL = null;
function pending(list) { return list.filter(function (r) { return r.status === 'Ожидает' && r.mine && r.mine.st === ''; }); }
function showInbox() {
  UNLOCKED = true; $('out').style.display = ''; $('hd').textContent = ME.name; $('staffBtn').style.display = ME.admin ? '' : 'none';
  $('app').innerHTML = '<div class="tabs"><button type="button" data-t="wait">Ждут подписи</button><button type="button" data-t="done">Подписано</button><button type="button" data-t="rej">Замечания</button><button type="button" data-t="all">Все акты</button></div><div id="list"><div class="center muted">Загрузка…</div></div>' +
    (!MOBILE ? '' : !('PushManager' in window) ? '<div class="card muted">Чтобы приходили уведомления на iPhone: Safari → «Поделиться» → «На экран „Домой“», затем откройте приложение со значка.</div>'
      : Notification.permission !== 'granted' ? '<button class="btn gray" id="nOn" type="button">🔔 Включить уведомления</button>' : '');

function load(quiet) {
  var before = pending(ITEMS).map(function (r) { return r.id; });
  return api({ sign_api: 'inbox', token: ls('sg_token') }).then(function (j) {
    ITEMS = j.items;
    if (ME && ME.admin) snapToJournal(ITEMS);
    try { localStorage.setItem('sg_items_' + ME.key, JSON.stringify(ITEMS)); } catch (e) {}
    var p = pending(ITEMS);
    $('bd').innerHTML = p.length ? '<span class="badge">' + p.length + '</span>' : '';
    if (navigator.setAppBadge) { if (p.length) navigator.setAppBadge(p.length).catch(function () {}); else navigator.clearAppBadge().catch(function () {}); }
    var fresh = p.filter(function (r) { return before.indexOf(r.id) < 0; });
    if (quiet && fresh.length) notify(fresh[0]);
    if ($('list')) drawList();
    if (MOBILE && j.confirms && j.confirms.length && !CONF) showConfirm(j.confirms[0]);
  }).catch(function (e) {
    if (/войдите заново/.test(e.message)) return showLogin('Войдите заново.');
    if (/смените пароль/.test(e.message)) return showChangePw();
    if (!quiet && $('list')) $('list').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  });
}
/* копия статусов в приложение «Объекты» (Документы → Сформированные) — только у администратора */
var SNAP_URL = 'https://script.google.com/macros/s/AKfycbyp8Fa5xU6sQPjSzkR5eLTnRfueW4qFOVHpWq4BS1hUeNQfCVSLK-Vivs7ruJiPYpQ/exec', SNAP_SITE = 'W9CnATTjvptvDqpJsiI4X-badjF973Y3', SNAP_LAST = '';
function snapToJournal(items) {
  try { var h = JSON.stringify((items || []).map(function (r) { return [r.id, r.status, r.done, r.pdf]; })); if (h === SNAP_LAST) return; SNAP_LAST = h;
    fetch(SNAP_URL, { method: 'POST', body: JSON.stringify({ site: SNAP_SITE, fn: 'avrSignSnapGh', args: [{ items: items }] }) }).catch(function () {}); } catch (e) {}
}
function notify(r) {
  try { navigator.vibrate && navigator.vibrate([150, 80, 150]); } catch (e) {}
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var t = 'АВР №' + r.num + ' — нужна ваша подпись', o = { body: [r.exe, r.obj].filter(Boolean).join(' · '), icon: 'icon-192.png', tag: r.id };
  navigator.serviceWorker && navigator.serviceWorker.ready ? navigator.serviceWorker.ready.then(function (s) { s.showNotification(t, o); }) : new Notification(t, o);

function stLine(r) {
  if (r.status === 'Отклонён') return '<div class="s no">✖ Отклонён' + (r.mine && r.mine.st === 'Отклонён' ? ' вами' : '') + '</div>';
  if (r.status === 'Подписан') return '<div class="s ok">✔ Подписан всеми' + (r.pdf ? ' · PDF готов' : '') + '</div>' +
    (!r.pdf && ME && ME.admin ? '<div class="s no" style="font-weight:400">PDF не сформирован — откройте акт и нажмите «Сформировать подписанный PDF»</div>' : '');
  if (r.mine && r.mine.st === 'Подписан') return '<div class="s ok">✔ Вы подписали · ждём остальных (' + r.done + '/' + r.all + ')</div>';
  if (!r.mine || r.mine.view) return '<div class="s">' + (r.mine ? '👁 Только просмотр · ' : '⏳ ') + 'подписано ' + r.done + '/' + r.all + '</div>';
  return '<div class="s w">● Ждёт вашей подписи (' + r.done + '/' + r.all + ')</div>';
}
/* «Подписано»: акты, подписанные за последние 24 часа (вами, а если вы не подписант — полностью) */
function ruTime(s) { var m = String(s || '').match(/(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/); return m ? new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5]).getTime() : 0; }

  if (r.mine && r.mine.st === 'Подписан') return ruTime(r.mine.at);
  if (r.status === 'Подписан') return Math.max.apply(null, [0].concat(r.signers.map(function (p) { return ruTime(p.at); })));

}
function recentDone(list) { var now = Date.now(); return list.filter(function (r) { var t = signedAt(r); return t && now - t < 24 * 3600 * 1000; }); }
function drawList() {
  [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.dataset.t === TAB); });
  var P = pending(ITEMS), D = recentDone(ITEMS), J = ITEMS.filter(function (r) { return r.status === 'Отклонён'; });
  [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { var n = { wait: P.length, rej: J.length }[b.dataset.t]; b.innerHTML = b.textContent.replace(/\s*\(\d+\)$/, '') + (n ? ' (' + n + ')' : ''); });
  var L = TAB === 'wait' ? P : TAB === 'done' ? D : TAB === 'rej' ? J : ITEMS;
  if (!L.length) { $('list').innerHTML = '<div class="center muted">' + (TAB === 'wait' ? 'Новых актов на подпись нет 👍' : TAB === 'done' ? 'За последние 24 часа подписанных нет' : TAB === 'rej' ? 'Замечаний нет 👍' : 'Пока нет актов (храним 30 дней)') + '</div>'; return; }
  $('list').innerHTML = L.map(function (r) {
    var isNew = r.status === 'Ожидает' && r.mine && r.mine.st === '';
    return '<div class="msg' + (isNew ? ' new' : '') + '" data-id="' + esc(r.id) + '"><span class="dot"></span><div class="b">' +
      '<div style="display:flex;gap:8px"><span class="t" style="flex:1">АВР №' + esc(r.num) + ' от ' + esc(r.date) + '</span><span class="tm">' + esc(r.created) + '</span></div>' +
      '<div>' + esc(r.exe) + '</div><div class="muted">' + esc([r.obj, r.blk && 'блок ' + r.blk, r.flr && r.flr + ' этаж'].filter(Boolean).join(', ')) + '</div>' +
      '<div class="muted">Сумма: <b style="color:var(--ink)">' + esc(r.total) + '</b></div>' + stLine(r) +
      (r.status === 'Отклонён' ? r.signers.filter(function (p) { return p.cm; }).map(function (p) { return '<div class="s no" style="font-weight:400">💬 ' + esc(p.name) + ': ' + esc(p.cm) + '</div>'; }).join('') : '') + '</div></div>';
  }).join('');
  [].forEach.call(document.querySelectorAll('.msg'), function (m) { m.onclick = function () { openAct(m.dataset.id); }; });
}

/* ---------- просмотр и подпись ---------- */
function fit(box) {
  var a = box.querySelector('.a4'); if (!a) return;
  var k = box.clientWidth / 794; a.style.transform = 'scale(' + k + ')'; box.style.height = (a.offsetHeight * k) + 'px';
}
var CUR_ACT = null, MKF = {};
function dropAct(id) { try { localStorage.removeItem('sg_act_' + id); } catch (e) {} }
function openAct(id) {
  CUR_ACT = id;
  $('app').innerHTML = '<button class="btn gray" id="back" type="button" style="margin:0 0 10px">← К сообщениям</button><div id="act"><div class="center muted">Открываю акт…</div></div>';
  $('back').onclick = showInbox;
  var key = 'sg_act_' + id, c = null;
  try { c = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
  if (!c) { var it = ITEMS.filter(function (x) { return x.id === id; })[0]; if (it && $('act')) $('act').innerHTML = '<div class="card"><b>АВР №' + esc(it.num) + ' от ' + esc(it.date) + '</b><div>' + esc(it.exe) + '</div>' + stLine(it) + '<div class="muted" style="margin-top:6px">Загружаю акт…</div></div>'; }
  else drawAct(c.act, c.html);
  api({ sign_api: 'act', token: ls('sg_token'), id: id }).then(function (j) {
    try { localStorage.setItem(key, JSON.stringify({ act: j.act, html: j.html })); } catch (e) {}
    if (!$('act') || CUR_ACT !== id || $('mdl').style.display === 'flex') return;
    if (!c || JSON.stringify(c.act) !== JSON.stringify(j.act) || c.html !== j.html) drawAct(j.act, j.html);
  }).catch(function (e) { if (!c && $('act') && CUR_ACT === id) $('act').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; });
}
function drawAct(r, html) {
  var myTurn = r.status === 'Ожидает' && r.mine && r.mine.st === '';
  var mineWait = myTurn && MOBILE;
  $('act').innerHTML = '<div class="card"><b>АВР №' + esc(r.num) + ' от ' + esc(r.date) + '</b><div>' + esc(r.exe) + '</div><div class="muted">' + esc([r.obj, r.blk && 'блок ' + r.blk, r.flr && r.flr + ' этаж'].filter(Boolean).join(', ')) + ' · сумма ' + esc(r.total) + '</div>' + stLine(r) +
    (r.pdf ? '<button class="btn gray" id="getPdf" type="button">📄 Открыть подписанный PDF</button>' : '') +
    (r.status === 'Отклонён' && ME.admin ? '<a class="btn" style="display:block;text-align:center;text-decoration:none" href="' + AVR_SITE + '?fix=' + encodeURIComponent(r.id) + '" target="_blank" rel="noopener">✏ Исправить в АВР и отправить заново</a>' : '') + '</div>' +
    '<div class="sheetBox" id="sb"><div class="a4">' + html + '</div></div>' +
    r.signers.filter(function (p) { return p.cm; }).map(function (p) { return '<div class="card err">✖ Отклонил ' + esc(p.name) + ' (' + esc(p.at) + '): ' + esc(p.cm) + '</div>'; }).join('') +
    ((r.hist || []).length ? '<div class="card muted"><b>Прошлые замечания (исправлено):</b>' + r.hist.map(function (p) { return '<div>• ' + esc(p.name) + ', ' + esc(p.at) + ': ' + esc(p.cm) + '</div>'; }).join('') + '</div>' : '') +
    (mineWait ? '<button class="btn ok" id="doSign" type="button">✔ Подписываю</button><button class="btn no" id="doRej" type="button">✖ Отклонить</button><div class="err" id="aErr"></div>' : '') +
    (ME.admin ? '<div style="display:flex;gap:8px"><button class="btn gray" type="button" data-pp="office">🖨 Печать — Офис</button><button class="btn gray" type="button" data-pp="shtab">🖨 Печать — Штаб</button></div><div class="muted" id="ppMsg" style="margin-top:6px"></div>' : '') +
    (ME.admin && r.status === 'Подписан' && !r.pdf ? '<button class="btn gray" id="mkPdf" type="button">Сформировать подписанный PDF</button>' : '');
  var sb = $('sb'); fit(sb); setTimeout(function () { fit(sb); }, 300); window.onresize = function () { fit(sb); };
  [].forEach.call(document.querySelectorAll('[data-pp]'), function (b) { b.onclick = function () {
    var t = b.textContent; b.disabled = true; b.textContent = 'Отправляю…';
    pdfB64(html).then(function (data) { return api({ sign_api: 'act_print', token: ls('sg_token'), id: r.id, place: b.dataset.pp, pdf: data }); })
      .then(function (j) { $('ppMsg').textContent = 'Отправлено на принтер: ' + j.queued + ' (напечатается, если тот компьютер включён)'; })
      .catch(function (e) { $('ppMsg').textContent = 'Не получилось: ' + e.message; })
      .then(function () { b.disabled = false; b.textContent = t; });
  }; });
  if ($('getPdf')) $('getPdf').onclick = function () {
    var b = this, w = window.open('', '_blank'); b.disabled = true; b.textContent = 'Открываю…';
    api({ sign_api: 'pdf', token: ls('sg_token'), id: r.id }).then(function (j) {
      var url = URL.createObjectURL(new Blob([unb64(j.pdf)], { type: 'application/pdf' }));
      if (w) w.location = url; else { var a = document.createElement('a'); a.href = url; a.download = j.name; a.click(); }
    }).catch(function (e) { if (w) w.close(); alert(e.message); }).then(function () { b.disabled = false; b.textContent = '📄 Открыть подписанный PDF'; });
  };
  if (r.status === 'Подписан' && !r.pdf && !MKF[r.id]) { MKF[r.id] = 1; makeFinal(r.id, html); }
  if ($('mkPdf')) $('mkPdf').onclick = function () { this.disabled = true; this.textContent = 'Формирую…'; makeFinal(r.id, html).then(function () { openAct(r.id); }); };
  if (!mineWait) return;
  if (!MOBILE) $('doSign').textContent = '✔ Подписать (подтвердить на телефоне)';
  $('doSign').onclick = function () {
    var b = this;
    if (!MOBILE) return pcSign(r, b);
    sheet('<h3 style="margin:0 0 8px">Подписать АВР №' + esc(r.num) + '?</h3><p class="muted">Вы подтверждаете, что работы выполнены, объёмы и сумма ' + esc(r.total) + ' верны.</p><button class="btn ok" id="mYes" type="button">✔ Подписываю</button><button class="btn gray" id="mNo" type="button">Отмена</button>');
    $('mNo').onclick = closeSheet;
    $('mYes').onclick = function () {
      closeSheet(); b.disabled = true; b.textContent = 'Подписываю…';
      var gate = ls('sg_bio') ? bioCheck() : Promise.resolve();
      gate.then(function () { return api({ sign_api: 'sign', token: ls('sg_token'), id: r.id }); }).then(function (j) {
        if (j.allSigned) { b.textContent = 'Все подписали — сохраняю PDF…'; return makeFinal(r.id, j.html).then(function () { dropAct(r.id); openAct(r.id); load(true); }); }
        dropAct(r.id); openAct(r.id); load(true);
      }).catch(function (e) { $('aErr').textContent = e.name === 'NotAllowedError' ? BIO + ' — не подтверждено' : e.message; b.disabled = false; b.textContent = '✔ Подписываю'; });
    };
  };
  $('doRej').onclick = function () {
    sheet('<h3 style="margin:0 0 8px">Отклонить АВР №' + esc(r.num) + '</h3><label>Причина (что исправить)</label><textarea id="mCm" rows="3"></textarea><button class="btn no" id="mYes" type="button">✖ Отклонить</button><button class="btn gray" id="mNo" type="button">Отмена</button><div class="err" id="mErr"></div>');
    $('mNo').onclick = closeSheet;
    $('mYes').onclick = function () {
      var cm = $('mCm').value.trim(); if (!cm) { $('mErr').textContent = 'Напишите причину'; return; }
      this.disabled = true;
      api({ sign_api: 'reject', token: ls('sg_token'), id: r.id, comment: cm }).then(function () { closeSheet(); dropAct(r.id); openAct(r.id); load(true); })
        .catch(function (e) { $('mErr').textContent = e.message; });
    };
  };
}
/* ---------- подпись с компьютера: подтверждение Face ID на телефоне ---------- */
var WAIT = null;
function pcSign(r, b) {
  sheet('<h3 style="margin:0 0 8px">Подписать АВР №' + esc(r.num) + '?</h3><p class="muted">Подпись нужно подтвердить на вашем телефоне через Face ID / отпечаток.</p><button class="btn ok" id="mYes" type="button">📱 Отправить на телефон</button><button class="btn gray" id="mNo" type="button">Отмена</button><div class="err" id="mErr"></div>');
  $('mNo').onclick = closeSheet;
  $('mYes').onclick = function () {
    this.disabled = true;
    api({ sign_api: 'confirm_req', token: ls('sg_token'), id: r.id, device: devName() }).then(function (j) {
      var left = 300;
      sheet('<div class="center" style="padding:10px"><div style="font-size:46px">📱</div><h3>Подтвердите на телефоне</h3><p class="muted">' +
        (j.phones ? 'На телефон отправлено уведомление. Откройте его и подтвердите Face ID / отпечатком.' : 'Уведомления на телефоне не включены. Откройте приложение «АВР Подписи» на телефоне — запрос появится там.') +
        '</p><p id="wLeft" class="muted"></p><button class="btn gray" id="wNo" type="button">Закрыть</button></div>');
      $('wNo').onclick = function () { clearInterval(WAIT); closeSheet(); };
      clearInterval(WAIT);
      WAIT = setInterval(function () {
        left -= 3; if ($('wLeft')) $('wLeft').textContent = 'Ожидание: ' + Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
        if (left <= 0) { clearInterval(WAIT); if ($('wLeft')) $('wLeft').textContent = 'Время вышло. Нажмите «Подписать» ещё раз.'; return; }
        api({ sign_api: 'confirm_status', token: ls('sg_token'), cid: j.cid }).then(function (s) {
          if (s.status === 'подписано') { clearInterval(WAIT); closeSheet(); dropAct(r.id); openAct(r.id); load(true); }
          else if (s.status === 'отменено') { clearInterval(WAIT); if ($('wLeft')) $('wLeft').textContent = 'Отменено на телефоне.'; }
        }).catch(function () {});
      }, 3000);
    }).catch(function (e) { $('mErr').textContent = e.message; });
  };
}
var CONF = null;
function showConfirm(c) {
  CONF = c;
  var bio = !!ls('sg_bio');
  sheet('<div style="font-size:13px;color:var(--blue);font-weight:700">ЗАПРОС С КОМПЬЮТЕРА</div><h3 style="margin:4px 0 8px">Подписать АВР №' + esc(c.num) + ' от ' + esc(c.date) + '?</h3>' +
    '<div>' + esc(c.exe) + '</div><div class="muted">' + esc(c.obj) + ' · сумма <b>' + esc(c.total) + '</b></div>' +
    (bio ? '' : '<label style="display:block;margin-top:10px">Пароль</label><input id="cCode" type="password" maxlength="40">') +
    '<button class="btn ok" id="cYes" type="button">' + (bio ? '✔ Подтвердить ' + BIO : '✔ Подтвердить') + '</button><button class="btn gray" id="cNo" type="button">Это не я / отменить</button><div class="err" id="cErr"></div>');
  $('cNo').onclick = function () { api({ sign_api: 'confirm', token: ls('sg_token'), cid: c.cid, yes: false }).catch(function () {}); CONF = null; closeSheet(); };
  $('cYes').onclick = function () {
    var b = this, code = $('cCode') ? $('cCode').value.trim() : '';
    if (!bio && !code) { $('cErr').textContent = 'Введите пароль'; return; }
    (bio ? bioCheck() : Promise.resolve()).then(function () {
      b.disabled = true; b.textContent = 'Подписываю…';
      return api({ sign_api: 'confirm', token: ls('sg_token'), cid: c.cid, yes: true, code: code });
    }).then(function (j) {
      return (j.allSigned ? makeFinal(c.id, j.html) : Promise.resolve()).then(function () {
        CONF = null; closeSheet(); showInbox();
      });
    }).catch(function (e) { b.disabled = false; b.textContent = '✔ Подтвердить'; $('cErr').textContent = e.name === 'NotAllowedError' ? BIO + ' — не подтверждено' : e.message; });
  };
}
/* ---------- смена пароля ---------- */
function afterLogin() { if (ME.mustChange) showChangePw(); else offerBio(); }
function showChangePw(msg) {
  UNLOCKED = false; $('out').style.display = ''; $('staffBtn').style.display = 'none';
  $('app').innerHTML = '<div class="card"><h3 style="margin:0 0 8px">Придумайте свой пароль</h3><p class="muted">Вы вошли по временному коду. Чтобы продолжить работу, задайте личный пароль: <b>не короче 6 знаков, минимум одна буква и одна цифра</b>. Никому его не сообщайте — даже администратор его не увидит.</p>' +
    '<label>Новый пароль</label><input id="p1" type="password" autocomplete="new-password"><label>Повторите пароль</label><input id="p2" type="password" autocomplete="new-password">' +
    '<button class="btn" id="pGo" type="button">Сохранить и продолжить</button><div class="err" id="pErr">' + esc(msg || '') + '</div></div>';
  $('pGo').onclick = function () {
    var a = $('p1').value, b = $('p2').value, btn = this;
    if (a !== b) { $('pErr').textContent = 'Пароли не совпадают'; return; }
    if (a.length < 6) { $('pErr').textContent = 'Не короче 6 знаков'; return; }
    if (!/[a-zа-яё]/i.test(a)) { $('pErr').textContent = 'Добавьте хотя бы одну букву'; return; }
    if (!/\d/.test(a)) { $('pErr').textContent = 'Добавьте хотя бы одну цифру'; return; }
    btn.disabled = true;
    api({ sign_api: 'set_password', token: ls('sg_token'), password: a }).then(function (j) {
      ME = j.me; ls('sg_me', JSON.stringify(ME)); UNLOCKED = true; showInbox();
    }).catch(function (e) { $('pErr').textContent = e.message; btn.disabled = false; });
  };
}
/* ---------- сотрудники (только администратор) ---------- */
var NEWCODE = null;
$('staffBtn').onclick = showStaff;
function showStaff() {
  $('app').innerHTML = '<button class="btn gray" id="back" type="button" style="margin:0 0 10px">← К сообщениям</button>' +
    '<div class="card"><h3 style="margin:0 0 8px">Сотрудники</h3><div class="muted">У каждого свой временный код для первого входа. Передайте код сотруднику лично — при входе он сразу придумает свой пароль, и код перестанет работать. Пароли не видит никто, в том числе вы.</div>' +
    '<label style="display:block;margin-top:10px">ФИО</label><input id="sName"><label>Должность</label><input id="sRole" list="roles" placeholder="Руководитель проекта, Прораб, Мастер…">' +
    '<datalist id="roles"><option value="Руководитель проекта"><option value="Руководитель ПТО"><option value="Инженеры ПТО"><option value="Прораб"><option value="Мастер"><option value="Директор"><option value="Заместитель директора"></datalist>' +
    '<button class="btn" id="sAdd" type="button">+ Добавить сотрудника</button><div class="err" id="sErr"></div><div id="sNew"></div></div><div id="sList"><div class="center muted">Загрузка…</div></div>';
  $('back').onclick = showInbox;
  $('sAdd').onclick = function () {
    var n = $('sName').value.trim(), r = $('sRole').value.trim(), b = this;
    if (!n) { $('sErr').textContent = 'Введите ФИО'; return; }
    if (!r) { $('sErr').textContent = 'Укажите должность'; return; }
    b.disabled = true; $('sErr').textContent = '';
    api({ sign_api: 'staff_add', token: ls('sg_token'), name: n, role: r }).then(function (j) {
      NEWCODE = { name: n, code: j.code }; showStaff();
    }).catch(function (e) { $('sErr').textContent = e.message; b.disabled = false; });
  };
  if (NEWCODE) { $('sNew').innerHTML = '<div class="code big">Код для входа<br><b>' + esc(NEWCODE.code) + '</b><br><span class="muted">' + esc(NEWCODE.name) + ' — передайте код лично, он действует до первого входа</span></div>'; NEWCODE = null; }
  api({ sign_api: 'staff_list', token: ls('sg_token') }).then(function (j) {
    $('sList').innerHTML = j.staff.map(function (u) {
      return '<div class="card" style="padding:12px"><b>' + esc(u.name) + '</b>' + (u.admin ? ' <span class="badge" style="background:var(--acc);color:#fff">админ</span>' : '') +
        '<div class="muted">' + esc(u.role || '—') + ' · ' + (u.last ? 'вход ' + esc(u.last) : 'ещё не входил') + (u.mustChange ? ' · свой пароль ещё не задан' : ' · пароль свой') + '</div>' +
        (u.code ? '<div class="code">Код для входа: <b>' + esc(u.code) + '</b></div>' : '') +
        '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn gray" type="button" data-rs="' + esc(u.name) + '" style="margin:0">Новый код</button>' +
        (u.admin ? '' : '<button class="btn no" type="button" data-del="' + esc(u.name) + '" style="margin:0">Удалить</button>') + '</div></div>';
    }).join('');
    [].forEach.call(document.querySelectorAll('[data-rs]'), function (b) { b.onclick = function () {
      if (!confirm('Выдать сотруднику «' + b.dataset.rs + '» новый код? Старый пароль перестанет работать, при входе он придумает новый.')) return;
      api({ sign_api: 'staff_reset', token: ls('sg_token'), name: b.dataset.rs }).then(function (j) { NEWCODE = { name: b.dataset.rs, code: j.code }; showStaff(); }).catch(function (e) { alert(e.message); });
    }; });
    [].forEach.call(document.querySelectorAll('[data-del]'), function (b) { b.onclick = function () {
      if (!confirm('Удалить сотрудника «' + b.dataset.del + '»? Он больше не сможет войти.')) return;
      api({ sign_api: 'staff_del', token: ls('sg_token'), name: b.dataset.del }).then(showStaff).catch(function (e) { alert(e.message); });
    }; });
  }).catch(function (e) { $('sList').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; });
}
function sheet(h) { $('mdlIn').innerHTML = h; $('mdl').style.display = 'flex'; }
function closeSheet() { $('mdl').style.display = 'none'; }
$('mdl').onclick = function (e) { if (e.target === this && !CONF) closeSheet(); };
function pdfB64(html) {
  var el = $('hidden'); el.innerHTML = html;
  return html2canvas(el, { scale: 2, backgroundColor: '#ffffff' }).then(function (cv) {
    var pdf = new jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    var k = Math.min(pw / cv.width, ph / cv.height);
    pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', (pw - cv.width * k) / 2, 0, cv.width * k, cv.height * k);
    el.innerHTML = '';
    return pdf.output('datauristring').split(',')[1];
  });
}
function makeFinal(id, html) {
  var el = $('hidden'); el.innerHTML = html;
  return html2canvas(el, { scale: 2, backgroundColor: '#ffffff' }).then(function (cv) {
    var pdf = new jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    var k = Math.min(pw / cv.width, ph / cv.height);
    pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', (pw - cv.width * k) / 2, 0, cv.width * k, cv.height * k);
    var data = pdf.output('datauristring').split(',')[1];
    el.innerHTML = '';
    return api({ sign_api: 'final', token: ls('sg_token'), id: id, pdf: data });
  }).catch(function () { /* PDF можно сформировать позже на сайте (раздел VIII) */ });
}
